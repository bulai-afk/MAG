name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      APP_URL: http://localhost:3000
      WEB_PORT: "3000"
      WORKER_HEALTH_PORT: "3001"
      DATABASE_URL: postgres://mag:mag@localhost:5432/mag
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-chars
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mag
          POSTGRES_PASSWORD: mag
          POSTGRES_DB: mag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mag -d mag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod
        continue-on-error: true
